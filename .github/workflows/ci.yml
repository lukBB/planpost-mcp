name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # `npm test` builds first (pretest), validates server.json and the
      # manifests, boots the stdio server and exercises hosted OAuth mode.
      - run: npm test
        env:
          OFFLINE: "1"
